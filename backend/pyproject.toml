[project]
name = "dilsos-backend"
version = "0.1.0"
description = "DILSOS — Dynamic Integrated Logistics Scheduling & Optimization System (API, workers, optimization engine)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pymysql>=1.1",
  "cryptography>=42",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "ortools>=9.10",
  "numpy>=1.26",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "mysql: requires a reachable MySQL (TEST_MYSQL_URL)",
  "slow: longer solver/benchmark tests",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["app/optimization", "app/schemas", "app/core"]
