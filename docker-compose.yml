# DILSOS development stack:  cp .env.example .env && docker compose up --build
# UI: http://localhost:8080   API docs: http://localhost:8080/api/docs
name: dilsos

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: mysql+pymysql://${MYSQL_USER:-dilsos}:${MYSQL_PASSWORD:-dilsos_dev_pw}@mysql:3306/${MYSQL_DATABASE:-dilsos}?charset=utf8mb4
  TASK_BACKEND: celery
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-change-me-dev-only-secret-0123456789abcdef}
  DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@dilsos.local}
  DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo1234}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  RUN_TIMEOUT_S: ${RUN_TIMEOUT_S:-300}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dilsos}
      MYSQL_USER: ${MYSQL_USER:-dilsos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dilsos_dev_pw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dilsos_root_dev_pw}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"   # dev only; removed in docker-compose.prod.yml
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    build: ./backend
    environment: *backend-env
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      api: { condition: service_healthy }   # api runs migrations first
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api/v1
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "8080:80"

volumes:
  mysql_data:
  redis_data:
