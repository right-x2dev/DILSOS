name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dilsos_test
          MYSQL_USER: dilsos
          MYSQL_PASSWORD: dilsos_ci_pw
          MYSQL_ROOT_PASSWORD: root_ci_pw
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_ci_pw"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Mypy (optimization/schemas/core)
        run: mypy
      - name: Pytest (SQLite)
        run: pytest -m "not slow"
      - name: Pytest (MySQL 8)
        env:
          TEST_MYSQL_URL: mysql+pymysql://dilsos:dilsos_ci_pw@127.0.0.1:3306/dilsos_test?charset=utf8mb4
        run: pytest -m "not slow" tests/integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build & start full stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/health/ready; then echo; break; fi
            sleep 5
          done
          curl -fsS http://localhost:8080/api/v1/health/ready
          docker compose ps
      - name: API smoke (login + demo scenario run)
        run: python3 scripts/smoke_test.py --base http://localhost:8080/api/v1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
